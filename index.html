    <script>
      (function() {
        // Suppress transient Vite HMR WebSocket connection errors per environment constraints
        if (typeof window !== 'undefined') {
          // Safe wrapper for WebSocket to swallow connection failures in proxy environment
          if (window.WebSocket) {
            var NativeWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              try {
                var ws = protocols !== undefined ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
                ws.addEventListener('error', function(e) {
                  if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
                });
                return ws;
              } catch (e) {
                return {
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  dispatchEvent: function() { return false; },
                  send: function() {},
                  close: function() {},
                  readyState: 3
                };
              }
            };
            window.WebSocket.prototype = NativeWebSocket.prototype;
          }

          var origConsoleError = console.error;
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            var text = args.map(function(a) { 
              return typeof a === 'string' ? a : (a && a.message) || String(a); 
            }).join(' ');
            if (
              text.indexOf('WebSocket') !== -1 || 
              text.indexOf('[vite]') !== -1 || 
              text.indexOf('vite:ws') !== -1 ||
              text.indexOf('@vite/client') !== -1
            ) {
              return;
            }
            origConsoleError.apply(console, arguments);
          };

          window.addEventListener('unhandledrejection', function(e) {
            var reason = e && e.reason;
            var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
            if (
              msg.indexOf('WebSocket') !== -1 || 
              msg.indexOf('vite:ws') !== -1 || 
              msg.indexOf('@vite/client') !== -1
            ) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            }
          }, true);

          window.addEventListener('error', function(e) {
            var msg = (e && (e.message || '')) || '';
            var filename = (e && (e.filename || '')) || '';
            var stack = (e && e.error && e.error.stack) || '';
            if (
              msg.indexOf('WebSocket') !== -1 || 
              filename.indexOf('@vite/client') !== -1 || 
              msg.indexOf('vite:ws') !== -1 ||
              stack.indexOf('@vite/client') !== -1
            ) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          }, true);
        }
      })();
    </script>
